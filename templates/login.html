<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Login</title>
</head>
<body class="bg-light">
    <div class="container-fluid min-vh-100 d-flex align-items-center py-4">
        <div class="row w-100 justify-content-center mx-0">
            <div class="col-12 col-sm-11 col-md-8 col-lg-5 col-xl-4">
                <div class="bg-white rounded-4 shadow-sm p-3 p-sm-4 p-md-4">
                    <h1 class="h3 text-center mb-2">Tree Guardian App</h1>
                    <p class="text-center text-muted mb-4">Login to your account</p>

                    <!-- Flash Messages -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                      {% for category, message in messages %}
                        <div class="alert alert-{{ category }} mb-3" role="alert">{{ message }}</div>
                      {% endfor %}
                    {% endwith %}

                    <form method="POST" class="w-100">
                        <div class="input-group input-group-lg mb-3">
                            <span class="input-group-text"><i class="fa fa-user"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Username" autocomplete="username" required>
                        </div>

                        <div class="input-group input-group-lg mb-3">
                            <span class="input-group-text"><i class="fa fa-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Password" autocomplete="current-password" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">Login</button>
                        </div>

                        <p class="text-center mt-3 mb-0">
                            Don't have an account? <a href="{{ url_for('register') }}">Register here</a><br>
                            Are you an Admin? <a href="{{ url_for('admin_login') }}">Login here</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
